<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#8b5cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#fbf7fd; --surface:#ffffff; --surface-2:#f5effa; --line:#eee4f5; --line-2:#dfd0ec;
  --text:#2a2340; --muted:#6c6384; --faint:#a197b6;
  --accent:#8b5cf6; --accent-soft:#f2ebfe; --accent-text:#ffffff; --purple:#0e8a8f; --purple-soft:#e0f4f4;
  --pink:#ec6fae; --blue:#5b8def;
  --grad:linear-gradient(120deg,#f472b6 0%,#a78bfa 52%,#60a5fa 100%);
  --grad-soft:linear-gradient(120deg,rgba(244,114,182,.14),rgba(167,139,250,.14) 52%,rgba(96,165,250,.12));
  --red:#e0442b; --red-soft:#fdebe6; --amber:#c27c0e; --amber-soft:#fdf3e1; --green:#1f8a5b; --green-soft:#e4f5ec;
  --shadow:0 1px 2px rgba(60,30,90,.06),0 2px 6px rgba(60,30,90,.04);
  --shadow-lg:0 14px 44px rgba(70,30,110,.18),0 2px 8px rgba(70,30,110,.08);
  --r:14px; --r-sm:10px;
  --st-todo:#a197b6; --st-doing:#8b5cf6; --st-review:#5b8def; --st-done:#1f8a5b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16121f; --surface:#211b2d; --surface-2:#2a2339; --line:#342a46; --line-2:#45385d;
  --text:#f1ebf8; --muted:#b3a8c8; --faint:#827796;
  --accent:#b99dff; --accent-soft:#30254a; --accent-text:#1a1328; --purple:#5fd3d4; --purple-soft:#163639;
  --pink:#f59ac8; --blue:#8ab2ff;
  --grad:linear-gradient(120deg,#f472b6 0%,#a78bfa 52%,#60a5fa 100%);
  --grad-soft:linear-gradient(120deg,rgba(244,114,182,.16),rgba(167,139,250,.16) 52%,rgba(96,165,250,.14));
  --red:#ff7a5f; --red-soft:#3d221d; --amber:#e3a542; --amber-soft:#3a2e18; --green:#4cc08a; --green-soft:#173027;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --st-todo:#827796; --st-doing:#b99dff; --st-review:#8ab2ff; --st-done:#4cc08a;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}

.app{display:grid;grid-template-columns:248px 1fr;height:100vh;height:100dvh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center}
.brand-title{font-weight:700;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--text)}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:12px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dot.lg{width:14px;height:14px;border-radius:4px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.empty-s{padding:6px 10px;color:var(--faint);font-size:13px}
.side-toggle{margin:8px 10px 0;font-size:12px;color:var(--faint);text-align:left}
.side-toggle:hover{color:var(--text)}
.archived .nav-item{opacity:.7}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.save{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:4px 10px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.save.ok i{background:var(--green)} .save.wait i{background:var(--amber);animation:pulse 1s infinite alternate}
.save.err{color:var(--red);cursor:pointer} .save.err i{background:var(--red)} .save.warn i{background:var(--amber)} .save.ro i{background:var(--accent)}
@keyframes pulse{to{opacity:.3}}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:flex-start;gap:14px;padding:20px 28px 14px;flex-wrap:wrap}
.top-titles{flex:1;min-width:200px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;height:34px;color:var(--faint)}
.search input{border:0;background:none;outline:none;width:170px;color:var(--text)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px}
.seg button{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:5px;color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--red)} .btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:24px;height:24px;border-radius:6px}
.menu{display:none}
.banner{margin:0 28px 10px;padding:9px 14px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13px;display:flex;align-items:center;gap:8px}
.chip.stuck{background:var(--purple-soft);color:var(--purple)}
.chip.stuck.alert{background:var(--red-soft);color:var(--red);font-weight:600}
.bell{position:relative}
.badge{position:absolute;top:2px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.alert-bar{margin:0 28px 10px;padding:8px 10px 8px 14px;border-radius:var(--r-sm);background:var(--red-soft);color:var(--red);font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alert-bar b{font-weight:700}
.alert-bar.recover{background:var(--accent-soft);color:var(--text)}
.alert-bar.recover .go{background:var(--grad);color:#fff}
.alert-bar.recover button{color:var(--accent)}
.alert-bar button{font-weight:600;font-size:12.5px;padding:4px 11px;border-radius:6px;color:var(--red)}
.alert-bar button:hover{background:color-mix(in srgb,var(--red) 10%,transparent)}
.alert-bar .go{background:var(--red);color:#fff}
.alert-bar .go:hover{background:var(--red);filter:brightness(1.08)}
.web-badge{position:absolute;left:-4px;top:-2px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 7px 2px 5px;display:flex;align-items:center;gap:3px;box-shadow:0 0 0 2px var(--bg);animation:pulse 1.2s infinite alternate}
.al-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.al-list .al-item:first-child{border-top:0}
.al-main{flex:1;min-width:210px}
.al-t{font-weight:600}
.al-m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.al-m .red{color:var(--red);font-weight:600}
.al-b{display:flex;gap:6px;flex-wrap:wrap}
.al-b .btn{height:28px;padding:0 10px;font-size:12px}
.al-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 2px}
.stuckseg{align-self:flex-start;flex-wrap:wrap}
.stuckseg button{font-size:13px}
.stuckseg button.on.st-sup{color:var(--purple)} .stuckseg button.on.st-team{color:var(--purple)}
.stuck-info{font-size:12px;font-weight:500;color:var(--purple);margin-left:2px}
.stuck-info.alert{color:var(--red)}
.content{flex:1;overflow:auto;padding:4px 28px 40px;min-height:0}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;min-width:0}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:2px 4px 10px}
.col-h .count{margin-left:auto}
.st{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st-todo{background:var(--st-todo)} .st-doing{background:var(--st-doing)} .st-review{background:var(--st-review)} .st-done{background:var(--st-done)}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;border-radius:var(--r-sm);transition:background .15s}
.col-body.over{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.drop-line{height:3px;border-radius:2px;background:var(--accent);margin:-4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.4}
.card.done .card-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.card-title{font-weight:500;word-wrap:break-word}
.card .ptag{margin-bottom:5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.over{background:var(--red-soft);color:var(--red)}
.chip.soon{background:var(--amber-soft);color:var(--amber)}
.chip.p-high{background:var(--red-soft);color:var(--red)}
.chip.p-med{background:var(--amber-soft);color:var(--amber)}
.chip.p-low{background:var(--surface-2);color:var(--muted)}
.chip.tag{background:none;border:1px solid var(--line);}
.ptag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
.ptag .dot{width:7px;height:7px;border-radius:2px}
.quick input{width:100%;border:1px dashed transparent;background:none;border-radius:var(--r-sm);padding:7px 10px;color:var(--text);outline:none}
.quick input::placeholder{color:var(--faint)}
.quick input:hover{background:var(--surface)}
.quick input:focus{background:var(--surface);border-color:var(--accent);border-style:solid}

/* List */
.lgroup{margin-bottom:22px}
.lgroup h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-main .meta{margin-top:3px}
.row-title{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.row.done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.row-side{display:flex;gap:6px;align-items:center;flex:none}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none}
.check:not(:disabled):hover{border-color:var(--green)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fchip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}
.fchip.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* Overview */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;transition:border-color .12s}
.stat:hover{border-color:var(--line-2)}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)} .stat.green .n{color:var(--green)}
.ov{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.panel h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.pcards{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;display:block}
.pcard:hover{border-color:var(--line-2)}
.pcard-h{display:flex;align-items:center;gap:9px;font-weight:600}
.pcard-h .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin:10px 0 8px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}
.pcard-m{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.pcard-m .red{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.muted-s{color:var(--faint);font-size:13px;padding:14px;text-align:center}

/* Modal */
#modal:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.4);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;padding:20px 22px;animation:rise .15s}
.dialog.sm{max-width:460px}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.dlg-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.dlg-h h2{margin:6px 0 0;font-size:17px;flex:1}
.title-in{flex:1;font-size:19px;font-weight:600;border:0;background:none;outline:none;padding:4px 0;border-bottom:1.5px solid transparent;letter-spacing:-.01em;min-width:0}
.title-in:focus{border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
.grid .fld{margin-bottom:0}
.fld input,.fld select,.fld textarea{font-size:14px;font-weight:400;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 9px;outline:none;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:84px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld :disabled{background:var(--surface-2);opacity:1;color:var(--text)}
.subs{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.sub-i{display:flex;align-items:center;gap:9px;padding:4px 2px;border-radius:6px}
.sub-i span{flex:1;font-size:14px;font-weight:400;color:var(--text)}
.sub-i.done span{text-decoration:line-through;color:var(--muted)}
.sub-i .x{opacity:0} .sub-i:hover .x{opacity:1}
.sub-i .check{width:18px;height:18px;border-radius:5px}
.prog{font-weight:500;color:var(--faint);margin-left:4px}
.dlg-f{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.grow{flex:1}
.confirm-t{font-size:13px;color:var(--red);font-weight:500}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.sw.on{border-color:var(--text)}
.cb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--text);margin-bottom:12px}
.cb input{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--faint);font-weight:400}
.sect{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sect h3{margin:0 0 4px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow-lg);animation:rise .15s}

/* Responsive */
.scrim{display:none}
@media (max-width:1100px){.board{grid-template-columns:repeat(4,260px)} .ov{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .nav-open .side{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  .menu{display:grid}
  .top{padding:14px 16px 10px}
  .content{padding:4px 16px 40px}
  .banner,.alert-bar{margin:0 16px 10px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .search input{width:110px}
  .grid{grid-template-columns:1fr 1fr}
  .grid .span2{grid-column:span 2}
  .top-actions .lbl-hide{display:none}
}
.ro .card{cursor:pointer}
.count.hot{color:var(--red);font-weight:700}
.chip.bb{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:color-mix(in srgb,var(--blue) 80%,var(--text))}
.card.bb{opacity:.78}
.bb-cb{align-items:flex-start}
.bb-cb svg{margin-top:3px;color:var(--blue)}
.bb-cb .hint{display:block}
.subs-strip{margin:0 0 16px}
.ss-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.ss-h b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.ss-toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.ss-toggle input{width:15px;height:15px;accent-color:var(--accent)}
.ss-cards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.ss-card{position:relative;flex:0 0 220px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;box-shadow:var(--shadow);transition:opacity .15s}
.ss-card:hover{border-color:var(--line-2);border-left-color:var(--c)}
.ss-card.hot{box-shadow:0 0 0 1px rgba(232,52,44,.3),0 0 14px rgba(232,52,44,.25)}
.ss-card.off{opacity:.5}
.ss-main{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:11px 40px 11px 12px}
.ss-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ss-main .bar{display:block;margin:0;height:5px}
.ss-m{font-size:12px;color:var(--muted)}
.ss-m .red{color:var(--red);font-weight:600}
.ss-eye{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.ss-eye:hover{background:var(--surface-2);color:var(--text)}
.ss-add{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 16px;min-height:64px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--muted);font-weight:600;font-size:13px}
.ss-add:hover{border-color:var(--accent);color:var(--accent)}
.empty-strip .ss-add{min-height:0;padding:7px 14px}
.card.from-sub{border-left:3px solid var(--c)}
.card.waiting,.row.waiting,.leg.waiting{opacity:.62}
.chip.wait{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}
.chip svg{flex:none}
.grid .span2{grid-column:span 2}
.est-in{display:flex;align-items:center;gap:6px}.est-in i{font-style:normal;font-weight:400;color:var(--faint);font-size:12.5px}
.deps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:400}
.deps select{flex:1;min-width:180px}
.dep-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:7px;padding:3px 4px 3px 8px;font-size:12.5px;color:var(--text);background:var(--surface-2)}
.dep-chip.ok{color:var(--green)}
.dep-chip .link,.dep-chip.link{color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.dep-chip.link{padding:3px 8px}
.dep-chip .x{width:20px;height:20px;display:grid;place-items:center;color:var(--faint);border-radius:5px}
.dep-chip .x:hover{background:var(--surface);color:var(--text)}
.atts{display:flex;flex-direction:column;gap:6px;font-weight:400}
.att{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.att img{width:44px;height:44px;object-fit:cover;border-radius:5px;flex:none;background:var(--surface-2)}
.att-ic{width:28px;height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.att a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);text-decoration:none}
.att a:hover{text-decoration:underline}
.att-add{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.att-add input{flex:1;min-width:180px}
.att-add .btn{height:34px;font-weight:600}
.hist{margin-top:4px;font-size:12.5px;color:var(--muted)}
.hist summary{cursor:pointer;font-weight:600;font-size:12px;padding:4px 0}
.hist-i{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.hist-i time{color:var(--faint);white-space:nowrap}
.btn.pinned{color:var(--amber)}

/* Thinking space */
.content.map-mode{padding:0;overflow:hidden;position:relative}
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background-color:var(--bg);background-image:radial-gradient(circle,var(--line-2) 1px,transparent 1.3px);background-size:26px 26px;border-top:1px solid var(--line)}
.map.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.smooth{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.world svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.link{fill:none;stroke:var(--line-2);stroke-width:2.2;stroke-linecap:round;transition:stroke .15s}
.link.dim{opacity:.35}
.link.tmp{stroke:var(--accent);stroke-dasharray:6 6}
.link-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.link-hit:hover + .link{stroke:var(--red);stroke-dasharray:5 5}
.ring-bg{fill:none;stroke:var(--line);stroke-width:4}
.ring{fill:none;stroke-width:4;stroke-linecap:round}
.dimmed{opacity:.35}
.stub{fill:none;stroke-width:2.2;stroke-linecap:round}
.leg-line{fill:none;stroke-width:2.2;stroke-linecap:round}
.anim .leg-line{stroke-dasharray:1;stroke-dashoffset:1;animation:grow .55s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.web{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid var(--c);cursor:pointer;transition:opacity .25s;box-shadow:var(--shadow)}
.web:hover{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.web.focus{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 26%,transparent),var(--shadow-lg)}
.web.dim{opacity:.4}
.web-name{font-weight:700;font-size:13.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.web-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.web-sub .late{color:var(--red);font-weight:600}
.web.warm{box-shadow:0 0 0 2px rgba(224,150,30,.4),0 0 24px 5px rgba(224,150,30,.32)}
.web.hot{animation:hot 1.7s ease-in-out infinite}
@keyframes hot{0%,100%{box-shadow:0 0 0 2px rgba(232,52,44,.4),0 0 18px 4px rgba(232,52,44,.35)}50%{box-shadow:0 0 0 4px rgba(232,52,44,.6),0 0 48px 16px rgba(232,52,44,.55)}}
.handle{position:absolute;right:-10px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--c);color:var(--c);font-size:14px;font-weight:700;display:grid;place-items:center;opacity:0;cursor:crosshair;transition:opacity .15s,transform .15s}
.handle:hover{transform:scale(1.2)}
.web:hover .handle,.web.focus .handle{opacity:1}
@media (hover:none){.handle{opacity:1}}
.leg{position:absolute;transform:translateX(-50%);width:186px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 9px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:12.5px}
.leg:hover{border-color:var(--line-2);border-left-color:var(--c)}
.anim .leg{animation:pop .35s ease-out backwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px) scale(.94)}}
.leg .check{width:17px;height:17px;border-radius:5px;margin-top:1px}
.leg-b{flex:1;min-width:0}
.leg-t{font-weight:600;line-height:1.3;word-break:break-word}
.leg .meta{margin-top:5px;gap:4px}
.leg.done{opacity:.55}.leg.done .leg-t{text-decoration:line-through}
.leg.hot{border-color:rgba(232,52,44,.55);border-left-color:var(--red);animation:leghot 1.7s ease-in-out infinite}
.anim .leg.hot{animation:pop .35s ease-out backwards,leghot 1.7s ease-in-out .4s infinite}
@keyframes leghot{0%,100%{box-shadow:0 0 0 1px rgba(232,52,44,.2),0 0 10px rgba(232,52,44,.25)}50%{box-shadow:0 0 0 2px rgba(232,52,44,.35),0 0 22px 4px rgba(232,52,44,.4)}}
.leg.warm{border-left-color:var(--amber)}
.leg.add,.leg.more{justify-content:center;font-weight:600;border-left-width:1px}
.leg.add{color:var(--muted);border-style:dashed;background:color-mix(in srgb,var(--surface) 75%,transparent)}
.leg.add:hover{color:var(--text)}
.leg.more{color:var(--accent)}
.map-ui{position:absolute;inset:0;pointer-events:none}
.map-ui>*{pointer-events:auto}
.pressing{position:absolute;left:16px;top:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:55%}
.pchip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 10px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);text-align:left}
button.pchip:hover{border-color:var(--red)}
.pchip .pd{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1s infinite alternate;flex:none}
.pchip small{color:var(--red);font-weight:500;font-size:12px}
.pchip.calm .pd{background:var(--green);box-shadow:none;animation:none}
.pchip.calm small{color:var(--muted)}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:34px;height:32px;display:grid;place-items:center;color:var(--muted);font-size:17px;font-weight:600}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--surface-2);color:var(--text)}
.map-hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--faint);max-width:calc(100% - 100px);pointer-events:none}
.fpanel{position:absolute;right:16px;top:14px;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:14px 16px;animation:rise .2s}
.fpanel h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.fpanel p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.fpanel .bar{margin:12px 0 7px}
.fpanel .row-b{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.fpanel .btn{height:30px;padding:0 10px;font-size:12.5px}
.tether{fill:none;stroke-width:4;stroke-linecap:round;opacity:.4}
.web.sub{outline:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:4px;padding:8px}
.web.sub .web-name{font-size:12px}
.web.sub .web-sub{font-size:10.5px}
.thought{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:220px;min-width:96px;padding:12px 16px;background:var(--c);color:#2e2c28;
  border-radius:24px 28px 26px 22px/22px 26px 28px 24px;font-size:13px;line-height:1.38;box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:opacity .25s}
.thought:hover{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 55%,transparent),var(--shadow)}
.thought::after{content:"";position:absolute;left:16px;bottom:-11px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:-9px 9px 0 -2px var(--c)}
.t-txt{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.thought.dim{opacity:.4}
.thought .handle{border-color:#8d887c;color:#5d594f;background:#fffdf7}
.thought:hover .handle{opacity:1}
.dbl-menu{position:absolute;transform:translate(-50%,10px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;display:flex;flex-direction:column;min-width:200px;animation:rise .12s;z-index:3}
.dbl-menu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-align:left;font-weight:500}
.dbl-menu button:hover{background:var(--surface-2)}
.dbl-menu small{display:block;color:var(--faint);font-size:11.5px;font-weight:400}
.fpanel .kin{margin-top:10px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.kin-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text);background:var(--surface)}
.kin-chip:hover{border-color:var(--line-2)}
.kin-chip .dot{width:7px;height:7px;border-radius:2px}
.nav-item.child{padding-left:calc(10px + var(--d)*16px)}
.nav-item.child .dot{width:8px;height:8px;border-radius:50%}
.pcard.child{margin-left:22px;width:calc(100% - 22px)}
.tcolors{display:flex;gap:8px}
.tcolors .sw{border-radius:50%}
/* ===== Today ===== */
.today{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start;max-width:1180px}
.hello h2{font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
.hello p{margin:0 0 22px;color:var(--muted);font-size:14px}
.hello .red{color:var(--red);font-weight:600}
.t-sec{margin-bottom:24px}
.t-sec>h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.focus-list{display:flex;flex-direction:column;gap:10px}
.fcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.fcard:hover{border-color:var(--line-2)}
.fcard.hot{border-color:rgba(232,52,44,.45);box-shadow:0 0 0 1px rgba(232,52,44,.15),0 0 18px rgba(232,52,44,.18)}
.check.big{width:24px;height:24px;border-radius:7px}
.fc-main{flex:1;min-width:0}
.fc-t{font-size:15.5px;font-weight:600;line-height:1.35}
.fcard .meta{margin-top:6px}
.wsort{display:flex;gap:2px;background:var(--accent-soft,rgba(168,85,247,.08));border-radius:9px;padding:2px;margin:-2px 0 10px}
.wsort button{flex:1;border:0;background:none;border-radius:7px;padding:4px 6px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.wsort button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(120,70,170,.15)}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pdot.hi{background:var(--red,#e8342c)}
.wmore{margin-top:6px}
.fcard.is-stuck .fc-t{opacity:.75}
.fgrip{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:34px;margin:-6px -6px -6px -8px;border-radius:7px;color:var(--muted,#9a8fb0);cursor:grab;touch-action:none;opacity:.55}
.fgrip:hover{opacity:1;background:rgba(150,110,200,.10)}
.fgrip svg{fill:currentColor;stroke:none}
.focus-list.sorting .fcard{transition:none}
.focus-list.sorting,.focus-list.sorting *{cursor:grabbing!important;user-select:none}
.fcard.dragging{opacity:.9;box-shadow:0 10px 28px rgba(120,70,170,.25);border-color:var(--line-2);transform:scale(1.01)}
.toast.undo{bottom:62px;display:flex;align-items:center;max-width:92vw}
.toast .toast-undo{margin-left:12px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.chip.reason.over{background:var(--red-soft);color:var(--red)}
.chip.reason.soon{background:var(--amber-soft);color:var(--amber)}
.chip.reason.pin{background:var(--amber-soft);color:var(--amber)}
.calm-empty{display:flex;gap:14px;align-items:center;padding:22px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);background:var(--surface)}
.calm-empty svg{width:28px;height:28px;color:var(--green)}
.calm-empty b{display:block;color:var(--text)}
.today-add{display:flex;gap:8px;margin-top:12px}
.nw-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin:10px 0 4px;padding:12px;border:1px dashed var(--accent,#a855f7);border-radius:12px;background:var(--accent-soft,rgba(168,85,247,.08))}
.nw-h{width:100%;font-size:12px;font-weight:700;color:var(--accent,#8b5cf6);text-transform:uppercase;letter-spacing:.04em}
.nw-row .nw-name{flex:1 1 200px;min-width:0;border:1px solid var(--line-2,#ddd);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
.nw-lab{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.nw-lab select{border:1px solid var(--line-2,#ddd);background:var(--surface);border-radius:9px;padding:8px;font-size:14px;color:var(--text);min-width:0}
.nw-btns{display:flex;gap:6px;margin-left:auto}
#f-due.flash{box-shadow:0 0 0 3px rgba(168,85,247,.45);transition:box-shadow .3s}
.today-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;outline:none}
.today-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.today-add select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 8px;max-width:180px}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13px;margin-top:10px}
.link-btn:hover{text-decoration:underline}
.link-btn.sm{margin:0;font-size:12px}
.done-today{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--green-soft);color:var(--green);font-size:13px}
.done-today svg{margin-top:3px}
.done-today span{display:inline-block;margin:2px 8px 0 0;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.done-today .dt-item{cursor:pointer}
.done-today .dt-item:hover{color:var(--text)}
.done-today span:not(:last-child)::after{content:" ·";text-decoration:none}
.prompt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);margin-bottom:10px}
.prompt.soft{background:var(--surface);border:1px solid var(--line)}
.prompt>div{flex:1;min-width:0}
.prompt b{display:block}
.prompt span{color:var(--muted);font-size:13px}
.p-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.prompt.soft .p-ic{background:var(--surface-2);color:var(--purple)}
.today-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.side-card h3{margin:0 0 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.mini{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.side-card .mini:first-of-type,.pk .mini:first-child,.tpl-l .mini:first-child{border-top:0}
.mini-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:hover .mini-t{color:var(--accent)}
.pk{max-height:60vh;overflow:auto}
.pk .btn{height:28px;padding:0 10px;font-size:12px}
/* workload meter */
.meter{margin-bottom:12px}
.meter-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.meter-h b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.meter-h i{font-style:normal;font-weight:500;color:var(--faint);font-size:12px}
.mbar{height:8px;border-radius:4px;background:var(--surface-2);margin:6px 0 5px;overflow:hidden}
.mbar span{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.meter.near .mbar span{background:var(--amber)}
.meter.over .mbar span{background:var(--red)}
.meter.over .meter-h b{color:var(--red)}
.meter-n{font-size:11.5px;color:var(--faint)}
.meter.over .meter-n b{color:var(--red)}
.hint svg{display:inline-block;vertical-align:-1px}
.due-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* ===== Meeting prep ===== */
.mp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.mp-head>div:first-child{flex:1;min-width:220px}
.mp-head b{display:block}
.mp-head span{font-size:13px;color:var(--muted)}
.mp-actions{display:flex;gap:8px;flex-wrap:wrap}
.mp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1180px}
.mp-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mp-card.wide{grid-column:1/-1}
.mp-card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.mp-card h3 .count{margin-left:auto}
.mp-card.good h3 svg{color:var(--green)}

function parseD(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function daysUntil(s){return Math.round((parseD(s)-parseD(TODAY))/86400000);}
function fmtDue(s){
  if(!s)return '';var n=daysUntil(s);
  if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';
  var d=parseD(s),o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}
function isOverdue(t){return !!t.due&&t.status!=='done'&&t.due<TODAY;}
function isSoon(t){return !!t.due&&t.status!=='done'&&daysUntil(t.due)>=0&&daysUntil(t.due)<=3;}

function normalize(s){
  s.title=s.title||'My Projects';s.projects=s.projects||[];s.tasks=s.tasks||[];s.links=Array.isArray(s.links)?s.links:[];
  s.thoughts=Array.isArray(s.thoughts)?s.thoughts:[];
  var ids={};s.projects.forEach(function(p){ids[p.id]=1;});
  s.projects.forEach(function(p){if(!p.parentId||!ids[p.parentId]||p.parentId===p.id)p.parentId=null;});
  s.projects.filter(function(p){return typeof p.x!=='number'||typeof p.y!=='number';}).forEach(function(p){var pos=freeSpot(s);p.x=pos.x;p.y=pos.y;});
  s.thoughts.forEach(function(t){t.text=t.text||'';t.color=t.color||TCOLORS[0];if(typeof t.x!=='number'){t.x=0;t.y=0;}});
  s.tasks.forEach(function(t,i){t.tags=t.tags||[];t.subtasks=t.subtasks||[];if(typeof t.order!=='number')t.order=i;t.priority=t.priority||'med';t.status=STATUS_LABEL[t.status]?t.status:'todo';t.due=t.due||'';t.notes=t.notes||'';
    t.deps=Array.isArray(t.deps)?t.deps:[];t.repeat=REPEAT_LABEL[t.repeat]?t.repeat:'';t.est=+t.est||0;t.attachments=Array.isArray(t.attachments)?t.attachments:[];t.today=t.today||'';t.skip=t.skip||'';t.backburner=!!t.backburner;});
  var tid={};s.tasks.forEach(function(t){tid[t.id]=1;});s.tasks.forEach(function(t){t.deps=t.deps.filter(function(d){return tid[d]&&d!==t.id;});});
  s.settings=Object.assign({weeklyHours:40,reviewDay:5,alertStyle:'edge',calm:false},s.settings||{});
  ['meetings','questions','reviews','templates','activity'].forEach(function(k){s[k]=Array.isArray(s[k])?s[k]:[];});
  s.meetingDraft=s.meetingDraft||'';
  s.focusOrder=Array.isArray(s.focusOrder)?s.focusOrder.filter(function(x){return typeof x==='string';}):[];
  return s;
}

var RECOVER_KEY='pm-recover-v1',editedBeforeLoad=false;
/* compare what this browser kept against the data that actually loaded; offer anything missing */
function checkRecovery(){
  var cur=stableStr(S);
  function same(p){try{return stableStr(normalize(JSON.parse(p.state)))===cur;}catch(e){return true;}}
  var p=local.get(PENDING_KEY);
  if(p&&p.state){if(!same(p))local.set(RECOVER_KEY,p);local.del(PENDING_KEY);}

}

function thought(id){for(var i=0;i<S.thoughts.length;i++)if(S.thoughts[i].id===id)return S.thoughts[i];return null;}
function node(id){return proj(id)||thought(id);}
function parentOf(p){var q=p&&p.parentId?proj(p.parentId):null;return q&&!q.archived?q:null;}

/* active projects in tree order: [{p,depth}] */
function treeOrder(){
  var out=[],seen={};
  function walk(p,d){if(seen[p.id])return;seen[p.id]=1;out.push({p:p,depth:d});childrenOf(p.id).forEach(function(c){walk(c,d+1);});}
  S.projects.filter(function(p){return !p.archived&&!parentOf(p);}).forEach(function(p){walk(p,0);});
  return out;
}

function freeSpotNear(par){
  var others=mapProjects().concat(S.thoughts);
  var angs=[-90,-55,-125,-25,-155,0,180,-70,-110,25,155];
  for(var r=radius(par)+150;r<1500;r+=70){
    for(var i=0;i<angs.length;i++){
      var a=angs[i]*Math.PI/180,x=par.x+Math.cos(a)*r,y=par.y+Math.sin(a)*r;
      if(others.every(function(o){return Math.hypot(o.x-x,o.y-y)>170;}))return {x:Math.round(x),y:Math.round(y)};
    }
  }

function freeSpot(s){
  s=s||S;var ps=s.projects.filter(function(p){return typeof p.x==='number'&&typeof p.y==='number'&&!p.archived;});
  if(!ps.length)return {x:0,y:0};
  var cx=ps.reduce(function(a,p){return a+p.x;},0)/ps.length,cy=ps.reduce(function(a,p){return a+p.y;},0)/ps.length;
  for(var r=260;r<4000;r+=130){
    var steps=Math.max(6,Math.round(2*Math.PI*r/160));
    for(var i=0;i<steps;i++){
      var a=i/steps*2*Math.PI-Math.PI/2,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*0.65;

    }
  }
  return {x:Math.round(cx+300),y:Math.round(cy)};
}
function legLayout(p){
  var R=radius(p);
  var ts=tasksOf(p.id).slice().sort(function(a,b){return ((a.status==='done')-(b.status==='done'))||byDue(a,b);});
  var items=ts.slice(0,12).map(function(t){return {t:t};});
  if(ts.length>12)items.push({more:ts.length-12});
  if(editable)items.push({add:true});
  var n=items.length,cols=n<=4?n:4;
  items.forEach(function(it,i){
    var col=i%cols,row=Math.floor(i/cols);

function fmtStamp(iso){var d=new Date(iso);if(isNaN(d))return '';var ds=dstr(d);return (ds===TODAY?'Today':(ds===addTo(TODAY,-1)?'Yesterday':fmtDue(ds)))+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function relDay(ds){var f=fmtDue(ds);return /^(Today|Tomorrow|Yesterday)$/.test(f)?f.toLowerCase():f;}
function addTo(ds,n){var d=parseD(ds);d.setDate(d.getDate()+n);return dstr(d);}
function weekStart(ds){var d=parseD(ds||TODAY);d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d);}
function ago(ds){var n=-daysUntil(ds);return n===0?'today':n===1?'yesterday':n>0?n+' days ago':'on '+fmtDue(ds);}
function liveOpen(){return liveTasks().filter(function(t){return t.status!=='done';});}
function longDate(ds){return parseD(ds).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}

/* ---------- workload ---------- */
function weekLoad(ws){
  var we=addTo(ws,6),isThis=ws===weekStart(),inW=function(d){return d&&d>=ws&&d<=we;};
  /* open work: due this week, pinned to a day this week (even with no due date), or overdue (this week only) */
  var ts=liveOpen().filter(function(t){return inW(t.due)||(!t.due&&inW(t.today))||(isThis&&t.due&&t.due<ws);});
  /* finished work this week still counts toward the week's hours */
  var dn=liveTasks().filter(function(t){return t.status==='done'&&inW(t.completedAt);});
  var open=ts.reduce(function(a,t){return a+(+t.est||0);},0),done=dn.reduce(function(a,t){return a+(+t.est||0);},0);
  return {h:open+done,open:open,done:done,noEst:ts.filter(function(t){return !t.est;}).length,count:ts.length};
}
function loadMeter(ws,label){
  var L=weekLoad(ws),cap=+S.settings.weeklyHours||40,pct=Math.min(100,L.h/cap*100),cls=L.h>cap?'over':(L.h>cap*.85?'near':'');
  return '<div class="meter '+cls+'"><div class="meter-h"><span>'+label+'</span><b>'+fmtHours(L.h)+' <i>/ '+cap+'h</i></b></div>'+
    '<div class="mbar">'+(L.done?'<span class="mdone" style="width:'+Math.min(100,L.done/cap*100).toFixed(1)+'%"></span>':'')+'<span style="width:'+Math.min(100,L.open/cap*100).toFixed(1)+'%"></span></div>'+
    '<div class="meter-n">'+(L.h>cap?'<b>Over by '+fmtHours(L.h-cap)+'.</b> Consider moving something.':(L.count?L.count+' task'+(L.count===1?'':'s')+' to do':'Nothing left to do'))+(L.done?' · '+fmtHours(L.done)+' done':'')+(L.noEst?' · '+L.noEst+' without an estimate':'')+'</div></div>';
}

/* ---------- today ---------- */
function todayScore(t){
  if(t.status==='done'||t.backburner||isWaiting(t)||t.skip===TODAY)return -1;
  /* stuck tasks stay in Your focus only when they were meant for today (pinned, due today or overdue) */
  if(stuckDays(t)>=0&&!(t.today===TODAY||(t.due&&daysUntil(t.due)<=0)))return -1;
  if(t.today!==TODAY&&t.due&&daysUntil(t.due)>0)return -1; /* future due dates live in "Coming up", not Your focus */
  var s=0;
  if(t.today===TODAY)s+=1000;
  if(t.due){var n=daysUntil(t.due);if(n<0)s+=100-n;else if(n===0)s+=90;else if(n===1)s+=60;else if(n<=3)s+=40;else if(n<=7)s+=15;}
  if(t.status==='doing')s+=25;else if(t.status==='review')s+=12;
  s+=t.priority==='high'?20:(t.priority==='med'?6:0);
  return s;
}
function todayReason(t){
  if(t.today===TODAY)return ['Pinned for today','pin'];
  if(t.due){var n=daysUntil(t.due);if(n<0)return ['Overdue '+dayWord(-n),'over'];if(n===0)return ['Due today','over'];if(n===1)return ['Due tomorrow','soon'];if(n<=7)return ['Due '+fmtDue(t.due),''];}
  if(t.status==='doing')return ['In progress',''];
  if(t.priority==='high')return ['High priority',''];
  return ['Up next',''];
}
function focusList(){
  var c=liveOpen().map(function(t){return {t:t,s:todayScore(t)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;});
  var pinned=c.filter(function(x){return x.t.today===TODAY;}).map(function(x){return x.t;});
  var rest=c.filter(function(x){return x.t.today!==TODAY;}).map(function(x){return x.t;});
  var list=pinned.concat(rest.slice(0,Math.max(0,5-pinned.length)));
  var ord=S.focusOrder||[];if(!ord.length)return list;
  var pos={};ord.forEach(function(id,i){pos[id]=i;});
  var known=list.filter(function(t){return pos[t.id]!==undefined;}).sort(function(a,b){return pos[a.id]-pos[b.id];});
  return known.concat(list.filter(function(t){return pos[t.id]===undefined;}));
}
function byFocusOrder(list){
  var pos={};(S.focusOrder||[]).forEach(function(id,i){pos[id]=i;});
  return list.map(function(t,i){return [t,i];}).sort(function(a,b){
    var pa=pos[a[0].id],pb=pos[b[0].id];
    if(pa!==undefined&&pb!==undefined)return pa-pb;
    if(pa!==undefined)return -1;if(pb!==undefined)return 1;return a[1]-b[1];}).map(function(x){return x[0];});
}
/* put these ids in this order, keeping them where the group already sat in your saved order */
function placeInFocusOrder(ids){
  var cur=(S.focusOrder||[]).slice(),at=cur.length;
  ids.forEach(function(id){var i=cur.indexOf(id);if(i>=0&&i<at)at=i;});
  if(at===cur.length)at=0;
  var rest=cur.filter(function(id){return ids.indexOf(id)<0;});
  var before=cur.slice(0,at).filter(function(id){return ids.indexOf(id)<0;}).length;
  S.focusOrder=rest.slice(0,before).concat(ids,rest.slice(before)).slice(0,300);
}
function setFocusOrder(ids){
  var seen={},live={};S.tasks.forEach(function(t){live[t.id]=1;});
  S.focusOrder=ids.concat(S.focusOrder||[]).filter(function(id){if(seen[id]||!live[id])return false;seen[id]=1;return true;}).slice(0,300);
}

}

    doing:lt.filter(function(t){return t.status==='doing'||t.status==='review';}).sort(byDue),

/* ---------- cloud storage: your data lives in the page's own database, separate from its code ---------- */
var db=null,dbMode=false,dbReady=false,dbDirty=false,dbWriting=false,dbTimer=null,dbRetry=0,lastWritten={},lastChunks=0,dbSubs={},remoteParts={},remoteTimer=null;
var DBC='pm';
function dbDocsFor(st){
  var clean=JSON.parse(JSON.stringify(st));
  var out={},chunks=[],cur=[],size=0;
  (clean.tasks||[]).forEach(function(t){var l=JSON.stringify(t).length;if(cur.length&&size+l>180000){chunks.push(cur);cur=[];size=0;}cur.push(t);size+=l;});
  if(cur.length||!chunks.length)chunks.push(cur);
  chunks.forEach(function(c,i){out[DBC+'/tasks-'+i]={tasks:c};});
  out[DBC+'/history']={activity:clean.activity||[],meetings:clean.meetings||[],reviews:clean.reviews||[]};
  out[DBC+'/extras']={templates:clean.templates||[]};
  out[DBC+'/core']={schema:1,taskChunks:chunks.length,version:clean.version||1,title:clean.title,projects:clean.projects||[],links:clean.links||[],thoughts:clean.thoughts||[],
    settings:clean.settings||{},questions:clean.questions||[],meetingDraft:clean.meetingDraft||'',focusOrder:clean.focusOrder||[],savedAt:new Date().toISOString()};
  return out;
}
function stateFromParts(core,tasks,hist,extras){
  return {version:core.version||1,title:core.title,projects:core.projects||[],links:core.links||[],thoughts:core.thoughts||[],settings:core.settings,questions:core.questions||[],meetingDraft:core.meetingDraft||'',focusOrder:core.focusOrder||[],
    tasks:tasks||[],activity:(hist&&hist.activity)||[],meetings:(hist&&hist.meetings)||[],reviews:(hist&&hist.reviews)||[],templates:(extras&&extras.templates)||[]};
}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({code:'timeout'});},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
/* read everything once; resolves null when the store has never been written */
function dbLoad(){
  return db.doc(DBC+'/core').get().then(function(cs){
    if(!cs.exists)return null;
    /* the store hands back read-only (frozen) objects: work on private copies */
    var core=JSON.parse(JSON.stringify(cs.data())),n=core.taskChunks||1,ps=[];
    for(var i=0;i<n;i++)ps.push(db.doc(DBC+'/tasks-'+i).get());
    ps.push(db.doc(DBC+'/history').get());ps.push(db.doc(DBC+'/extras').get());
    return Promise.all(ps).then(function(r){
      function copy(sn){return sn.exists?JSON.parse(JSON.stringify(sn.data())):null;}
      var tasks=[];for(var i=0;i<n;i++){var tc=copy(r[i]);if(tc)tasks=tasks.concat(tc.tasks||[]);}
      var hist=copy(r[n]),extras=copy(r[n+1]);
      lastWritten={};lastChunks=n;
      lastWritten[DBC+'/core']=JSON.stringify(core);
      for(var j=0;j<n;j++)if(r[j].exists)lastWritten[DBC+'/tasks-'+j]=JSON.stringify(r[j].data());
      if(hist)lastWritten[DBC+'/history']=JSON.stringify(hist);
      if(extras)lastWritten[DBC+'/extras']=JSON.stringify(extras);
      return stateFromParts(core,tasks,hist,extras);

  });
}
function dbFlush(){
  if(!dbReady||!editable)return;
  if(dbWriting){dbDirty=true;return;}
  dbWriting=true;dbDirty=false;setStatus('saving');
  var docs=dbDocsFor(S),core=DBC+'/core';
  var keys=Object.keys(docs).filter(function(k){return k!==core;});keys.push(core);
  var changed=keys.filter(function(k){
    if(k===core){var a=JSON.parse(JSON.stringify(docs[k]));delete a.savedAt;var b=lastWritten[k]?JSON.parse(lastWritten[k]):null;if(b)delete b.savedAt;return !b||JSON.stringify(a)!==JSON.stringify(b);}
    return lastWritten[k]!==JSON.stringify(docs[k]);
  });
  var newChunks=docs[core].taskChunks,oldChunks=lastChunks,seq=Promise.resolve();
  changed.forEach(function(k){seq=seq.then(function(){
    var j=JSON.stringify(docs[k]);

    return db.doc(k).set(docs[k]).then(function(){lastWritten[k]=j;});
  });});
  for(var i=newChunks;i<oldChunks;i++)(function(i){seq=seq.then(function(){return db.doc(DBC+'/tasks-'+i).delete().then(function(){delete lastWritten[DBC+'/tasks-'+i];});});})(i);
  seq.then(function(){
    lastChunks=newChunks;dbWriting=false;dbRetry=0;
    if(dbDirty){dbFlush();return;}
    setStatus('saved');local.del(PENDING_KEY);

  }).catch(function(e){
    dbWriting=false;dbDirty=true;var c=e&&e.code;

    if(c==='too_big'||c==='quota_exceeded'){setStatus('error');toast('Your data has grown too big to save in one place. Use Settings → Copy backup, then ask Claude to help tidy it.');return;}
    if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){setStatus('error');return;}
    dbRetry++;setStatus(dbRetry>2?'error':'pending');

  });

var dbEverSaved=false;
function dbQueue(){
  keepPending();dbDirty=true;setStatus('pending');

/* live sync: changes made on another device show up here */
function watchDoc(k){

    if(snap.metadata&&snap.metadata.hasPendingWrites)return;

    if(k===DBC+'/core'){var a=JSON.parse(j),b=lastWritten[k]?JSON.parse(lastWritten[k]):null;delete a.savedAt;if(b){delete b.savedAt;if(JSON.stringify(a)===JSON.stringify(b)){lastWritten[k]=j;return;}}}

function applyRemote(){
  if(dbDirty||dbWriting){remoteParts={};return;}
  if(modalOpen||mapBusy){remoteTimer=setTimeout(applyRemote,1200);return;}
  dbLoad().then(function(st){

    var next=normalize(st);

}
function startDb(d){
  db=d;dbMode=true;
  setStatus('init');
  return withTimeout(dbLoad(),10000).then(function(st){
    if(!st){

    }else{
      var dbState=normalize(st);
      if(editedBeforeLoad&&stableStr(S)!==stableStr(dbState))local.set(RECOVER_KEY,{at:new Date().toISOString(),state:JSON.stringify(S)});
      S=dbState;dbReady=true;dbEverSaved=true;setStatus(editable?'saved':'ro');

    checkRecovery();render();

  });
}

/* ---------- mutations ---------- */
function setStatusOf(t,st,quiet){

function advance(d,rep){
  var x=parseD(d);
  if(rep==='daily')x.setDate(x.getDate()+1);
  else if(rep==='weekdays'){do{x.setDate(x.getDate()+1);}while(x.getDay()===0||x.getDay()===6);}
  else if(/^w[0-6]$/.test(rep)){var wd=+rep[1];do{x.setDate(x.getDate()+1);}while(x.getDay()!==wd);}
  else if(rep==='weekly')x.setDate(x.getDate()+7);
  else if(rep==='biweekly')x.setDate(x.getDate()+14);
  else if(rep==='monthly'){var day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));}
  return dstr(x);
}
function spawnRepeat(t){

}
function isWaiting(t){return t.status!=='done'&&t.deps.some(function(d){var x=task(d);return x&&x.status!=='done';});}

/* every task that (directly or indirectly) waits on t — can't become t's dependency */
function downstream(t){var out={},stack=[t.id];while(stack.length){var id=stack.pop();S.tasks.forEach(function(x){if(x.deps.indexOf(id)>=0&&!out[x.id]){out[x.id]=1;stack.push(x.id);}});}return out;}
function waitChip(t){if(!isWaiting(t))return '';var w=waitingOn(t);return '<span class="chip wait" title="Waits on: '+esc(w.map(function(x){return x.title;}).join(', '))+'">'+ico.lock+(w.length===1?'Waits on “'+esc(w[0].title.length>22?w[0].title.slice(0,22)+'…':w[0].title)+'”':'Waits on '+w.length)+'</span>';}
function repeatChip(t){return t.repeat?'<span class="chip" title="'+REPEAT_LABEL[t.repeat]+'">'+ico.repeat+'</span>':'';}

function moveTask(id,st,beforeId){
  var t=task(id);if(!t)return;

/* drag & drop */
var dragId=null,line=document.createElement('div');line.className='drop-line';
function clearDrop(){document.querySelectorAll('.col-body.over').forEach(function(x){x.classList.remove('over');});if(line.parentNode)line.parentNode.removeChild(line);}
function afterCard(body,y){
  var cards=[].slice.call(body.querySelectorAll('.card:not(.dragging)'));
  for(var i=0;i<cards.length;i++){var r=cards[i].getBoundingClientRect();if(y<r.top+r.height/2)return cards[i];}
  return null;
}
root.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c||!editable)return;dragId=c.getAttribute('data-id');c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}});
root.addEventListener('dragend',function(){document.querySelectorAll('.dragging').forEach(function(x){x.classList.remove('dragging');});clearDrop();dragId=null;});
root.addEventListener('dragover',function(e){
  var b=e.target.closest&&e.target.closest('[data-drop]');if(!b||!dragId)return;e.preventDefault();
  if(!b.classList.contains('over')){clearDrop();b.classList.add('over');}
  var nxt=afterCard(b,e.clientY);var anchor=nxt||b.querySelector('.quick');
  if(anchor){if(line.nextSibling!==anchor)b.insertBefore(line,anchor);}else if(line.parentNode!==b||line.nextSibling)b.appendChild(line);
});
root.addEventListener('drop',function(e){
  var b=e.target.closest&&e.target.closest('[data-drop]');if(!b||!dragId)return;e.preventDefault();
  var nxt=afterCard(b,e.clientY);var id=dragId;clearDrop();dragId=null;
  moveTask(id,b.getAttribute('data-drop'),nxt?nxt.getAttribute('data-id'):null);commit();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modalOpen){closeModal();return;}
  if(e.key==='Escape'&&ui.nav){ui.nav=false;render();}
