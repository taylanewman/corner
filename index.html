/* ---------- modal helpers ---------- */
function openModal(html,cls){
  modalHost.innerHTML='<div class="overlay"><div class="dialog '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  modalOpen=true;
  var ov=modalHost.firstChild;
  ov.addEventListener('mousedown',function(e){if(e.target===ov)closeModal();});
  return ov.firstChild;
}
function closeModal(){modalHost.innerHTML='';modalOpen=false;}
function opt(list,val){return list.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');}

/* picking "Every Monday" etc. fills in the matching due date right away */
document.addEventListener('change',function(e){
  var r=e.target;if(!r||r.id!=='f-rep'||!/^w[0-6]$/.test(r.value))return;
  var dl=r.closest('.dialog'),fd=dl&&dl.querySelector('#f-due');if(!fd)return;
  var wd=+r.value[1];if(fd.value&&parseD(fd.value).getDay()===wd)return;
  var nx=parseD(TODAY);while(nx.getDay()!==wd)nx.setDate(nx.getDate()+1);fd.value=dstr(nx);
  fd.classList.add('flash');setTimeout(function(){fd.classList.remove('flash');},900);
});
/* ---------- make a new web right from a project picker ---------- */
document.addEventListener('focusin',function(e){var sl=e.target;if(sl&&sl.matches&&sl.matches('select[data-newweb]')&&sl.value!=='__new')sl.setAttribute('data-prev',sl.value);});
document.addEventListener('change',function(e){
  var sl=e.target;if(!sl||!sl.matches||!sl.matches('select[data-newweb]')||sl.value!=='__new'||!editable)return;
  var prevV=sl.getAttribute('data-prev')||'';
  var anchor=sl.closest('.grid')||sl.closest('form')||sl.parentNode;
  var old=anchor.parentNode.querySelector('.nw-row');if(old)old.remove();
  var row=document.createElement('div');row.className='nw-row';
  row.innerHTML='<div class="nw-h">New web</div><input class="nw-name" placeholder="Name, e.g. Bilingual Bookshelf" autocomplete="off">'+
    '<label class="nw-lab">Inside<select class="nw-par"><option value="">— Nothing (its own big web) —</option>'+treeOrder().map(function(n){return '<option value="'+n.p.id+'"'+(n.p.id===prevV?' selected':'')+'>'+esc(fullName(n.p))+'</option>';}).join('')+'</select></label>'+
    '<div class="nw-btns"><button type="button" class="btn ghost nw-cancel">Cancel</button><button type="button" class="btn primary nw-ok">Create web</button></div>';
  anchor.insertAdjacentElement('afterend',row);
  if(prevV)sl.value=prevV;
  var nm=row.querySelector('.nw-name');nm.focus();
  function make(){
    var name=nm.value.trim();if(!name){nm.focus();return;}
    var par=row.querySelector('.nw-par').value||null,pp=par?proj(par):null;
    var sp=pp?freeSpotNear(pp):freeSpot();
    var np={id:uid(),name:name,description:'',color:pp?pp.color:COLORS[S.projects.length%COLORS.length],archived:false,created:TODAY,x:sp.x,y:sp.y,parentId:par};
    S.projects.push(np);logAct('Created project “'+name+'”',np);scheduleSave();
    var o=document.createElement('option');o.value=np.id;o.textContent=fullName(np);sl.insertBefore(o,sl.querySelector('option[value="__new"]'));
    sl.value=np.id;sl.setAttribute('data-prev',np.id);row.remove();
    toast('Created “'+name+'”'+(pp?' inside '+pp.name:''));
  }
  row.querySelector('.nw-ok').addEventListener('click',make);
  row.querySelector('.nw-cancel').addEventListener('click',function(){row.remove();});
  nm.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();make();}else if(ev.key==='Escape'){ev.stopPropagation();row.remove();}});
});

/* ---------- task modal ---------- */
function openTask(id,preset){
  preset=preset||{};
  var orig=id?task(id):null;
  var activeP=S.projects.filter(function(p){return !p.archived;});
  if(!orig&&!activeP.length){openProject(null);return;}
  var t=orig?JSON.parse(JSON.stringify(orig)):{id:null,projectId:preset.pid||activeP[0].id,title:preset.title||'',status:preset.status||'todo',priority:'med',due:preset.due||'',tags:[],notes:'',subtasks:[],deps:[],repeat:'',est:0,attachments:[],today:preset.today||''};
  var dis=editable?'':' disabled';
  var projOpts=treeOrder().map(function(n){return [n.p.id,fullName(n.p)];});
  if(!projOpts.some(function(o){return o[0]===t.projectId;})&&proj(t.projectId))projOpts.push([t.projectId,proj(t.projectId).name]);
  var hist=orig?S.activity.filter(function(a){return a.task===orig.id;}).slice(0,6):[];
  var blocksList=orig?dependents(orig):[];
  var d=openModal(
    '<div class="dlg-h"><input class="title-in" id="f-title" placeholder="Task title" value="'+esc(t.title)+'"'+dis+'><button class="icon-btn" data-m="close" aria-label="Close">'+ico.x+'</button></div>'+
    '<div class="grid">'+
      '<label class="fld">Project<select id="f-proj" data-newweb'+dis+'>'+opt(projOpts,t.projectId)+(editable?'<option value="__new">＋ Create a new web…</option>':'')+'</select></label>'+
      '<label class="fld">Status<select id="f-status"'+dis+'>'+opt(STATUSES,t.status)+'</select></label>'+
      '<label class="fld">Priority<select id="f-prio"'+dis+'>'+opt(PRIOS,t.priority)+'</select></label>'+
      '<label class="fld">Due date<input type="date" id="f-due" value="'+esc(t.due)+'"'+dis+'></label>'+
      '<label class="fld">Estimate<span class="est-in"><input type="number" id="f-est" min="0" step="0.25" placeholder="0" value="'+(t.est||'')+'"'+dis+'><i>hours</i></span></label>'+
      '<label class="fld">Repeats<select id="f-rep"'+dis+'>'+opt(REPEATS,t.repeat)+'</select></label>'+
      '<div class="fld span2">Waits on <div class="deps" id="f-deps"></div></div>'+
    '</div>'+
    (blocksList.length?'<div class="fld">Other tasks waiting on this one<div class="deps">'+blocksList.map(function(x){return '<button class="dep-chip link" data-goto="'+x.id+'">'+esc(x.title)+'</button>';}).join('')+'</div></div>':'')+
    '<div class="fld"><span>Stuck? <span id="f-stuckinfo"></span></span><div class="seg stuckseg" id="f-stuck"></div><input id="f-stucknote" placeholder="What are you waiting for? (optional)" style="margin-top:6px;display:none"'+dis+'></div>'+
    '<label class="cb bb-cb"><input type="checkbox" id="f-bb"'+(t.backburner?' checked':'')+dis+'>'+ico.moon+'<span><b>Backburner</b> <span class="hint">Keep it on the list, but no alerts, red, nudges or Today reminders.</span></span></label>'+
    '<label class="fld">Notes<textarea id="f-notes" rows="3" placeholder="Details, links, ideas…"'+dis+'>'+esc(t.notes)+'</textarea></label>'+
    '<div class="fld">Checklist<span id="f-prog"></span><div class="subs" id="f-subs"></div>'+(editable?'<form id="f-subadd"><input placeholder="+ Add checklist item" autocomplete="off"></form>':'')+'</div>'+
    '<div class="fld">Attachments<div class="atts" id="f-atts"></div><div id="f-attadd"></div></div>'+
    (hist.length?'<details class="hist"><summary>History</summary>'+hist.map(function(a){return '<div class="hist-i"><span>'+esc(a.msg)+'</span><time>'+esc(fmtStamp(a.at))+'</time></div>';}).join('')+'</details>':'')+
    '<div class="dlg-f" id="f-foot"></div>'
  );
  function drawDeps(){
    var box=d.querySelector('#f-deps');
    var chips=t.deps.map(task).filter(Boolean).map(function(x){return '<span class="dep-chip'+(x.status==='done'?' ok':'')+'">'+(x.status==='done'?ico.check:ico.lock)+'<button class="link" data-goto="'+x.id+'">'+esc(x.title)+'</button>'+(editable?'<button class="x" data-depdel="'+x.id+'" aria-label="Remove">'+ico.x+'</button>':'')+'</span>';}).join('');
    var sel='';
    if(editable){
      var bad=orig?downstream(orig):{};
      var cands=S.tasks.filter(function(x){return x.status!=='done'&&(!orig||x.id!==orig.id)&&t.deps.indexOf(x.id)<0&&!bad[x.id]&&proj(x.projectId)&&!proj(x.projectId).archived;});
      var fp=d.querySelector('#f-proj'),here=(fp&&fp.value&&fp.value!=='__new')?fp.value:t.projectId,PRK={high:0,med:1,low:2};
      var pk=function(x){var v=PRK[x.priority];return v===undefined?3:v;};
      var mine=cands.filter(function(x){return x.projectId===here;}).sort(function(a,b){return pk(a)-pk(b)||byDue(a,b);});
      var others=cands.filter(function(x){return x.projectId!==here;});
      var optOf=function(x,showWeb){var p=proj(x.projectId);return '<option value="'+x.id+'">'+esc(x.title)+(showWeb&&p?' — '+esc(p.name):'')+'</option>';};
      var hereName=proj(here)?proj(here).name:'this web';
      sel='<select id="f-depadd"><option value="">+ Add a task this waits on…</option>'+
        '<optgroup label="In '+esc(hereName)+'">'+(mine.length?mine.map(function(x){return optOf(x,false);}).join(''):'<option value="" disabled>(no other open tasks here)</option>')+'</optgroup>';
      if(!depMore){if(others.length)sel+='<option value="__more">See more… ('+others.length+' in other webs)</option>';}
      else [['High priority',0],['Medium priority',1],['Low priority',2],['No priority',3]].forEach(function(g){
        var grp=others.filter(function(x){return pk(x)===g[1];}).sort(byDue);
        if(grp.length)sel+='<optgroup label="'+g[0]+'">'+grp.map(function(x){return optOf(x,true);}).join('')+'</optgroup>';
      });
      sel+='</select>';
    }
    box.innerHTML=chips+(chips||editable?'':'<span class="hint">Nothing</span>')+sel;
    var s2=d.querySelector('#f-depadd');if(s2)s2.addEventListener('change',function(){
      if(s2.value==='__more'){depMore=true;drawDeps();var s3=d.querySelector('#f-depadd');if(s3){s3.focus();try{if(s3.showPicker)s3.showPicker();}catch(_){}}return;}
      if(s2.value){t.deps.push(s2.value);drawDeps();}});
  }
  var depMore=false;
  function drawAtts(){
    var box=d.querySelector('#f-atts');
    box.innerHTML=t.attachments.map(function(a,i){
      var url=a.kind==='file'?'/_blob/'+a.assetId:a.url;
      var isImg=a.kind==='file'&&/^image\//.test(a.type||'');
      return '<div class="att">'+(isImg?'<img src="'+esc(url)+'" alt="" onerror="this.style.display=\'none\'">':'<span class="att-ic">'+(a.kind==='file'?ico.clip:ico.link)+'</span>')+
        '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(a.name||url)+'</a>'+(editable?'<button class="icon-btn sm" data-attdel="'+i+'" aria-label="Remove attachment">'+ico.x+'</button>':'')+'</div>';
    }).join('')||(editable?'':'<span class="hint">None</span>');
    var add=d.querySelector('#f-attadd');
    if(!editable){add.innerHTML='';return;}
    add.innerHTML='<form class="att-add" id="f-linkform"><input id="f-linkurl" placeholder="Paste a link (https://…)" autocomplete="off"><button class="btn" type="submit">Add link</button>'+
      (assetsNs?'<label class="btn" title="Upload an image, PDF or text file (up to 20 MB)">'+ico.clip+'Upload file<input type="file" id="f-file" hidden accept="image/*,application/pdf,.csv,.md,.txt,.json,video/mp4,video/webm"></label>':'')+'</form><div class="hint" id="f-atterr"></div>';
    d.querySelector('#f-linkform').addEventListener('submit',function(e){
      e.preventDefault();var inp=d.querySelector('#f-linkurl'),v=inp.value.trim();if(!v)return;
      if(!/^https?:\/\//i.test(v))v='https://'+v;
      var name=v.replace(/^https?:\/\/(www\.)?/i,'').slice(0,60);
      t.attachments.push({id:uid(),kind:'link',url:v,name:name});inp.value='';drawAtts();
    });
    var fi=d.querySelector('#f-file');
    if(fi)fi.addEventListener('change',function(){
      var file=fi.files&&fi.files[0];if(!file)return;
      var err=d.querySelector('#f-atterr');err.textContent='Uploading '+file.name+'…';
      var ext=(file.name.split('.').pop()||'').toLowerCase();
      var TYPES={csv:'text/csv',md:'text/markdown',txt:'text/plain',json:'application/json',pdf:'application/pdf'};
      var opts=(!file.type||TYPES[ext])&&TYPES[ext]?{type:TYPES[ext]}:undefined;
      assetsNs.upload(file,opts).then(function(r){
        t.attachments.push({id:uid(),kind:'file',assetId:r.id,name:file.name,type:r.contentType});err.textContent='';drawAtts();
      }).catch(function(e2){
        var c=e2&&e2.code;
        err.textContent=c==='too_large'?'That file is too big (20 MB max).':c==='unsupported_type'?'That file type isn’t supported. Try an image, PDF or text file.':c==='quota_or_state'?'Storage is full for this page.':'Couldn’t upload that file. Please try again.';
      });
    });
  }
  function drawSubs(){
    var box=d.querySelector('#f-subs');
    box.innerHTML=t.subtasks.map(function(s,i){return '<div class="sub-i'+(s.done?' done':'')+'"><button class="check'+(s.done?' on':'')+'" data-sub="'+i+'"'+dis+' aria-label="Toggle item">'+ico.check+'</button><span>'+esc(s.text)+'</span>'+(editable?'<button class="icon-btn sm x" data-subdel="'+i+'" aria-label="Remove item">'+ico.x+'</button>':'')+'</div>';}).join('')||(editable?'':'<div class="hint">No checklist items.</div>');
    var done=t.subtasks.filter(function(s){return s.done;}).length;
    d.querySelector('#f-prog').innerHTML=t.subtasks.length?'<span class="prog">'+done+'/'+t.subtasks.length+'</span>':'';
  }
  function drawFoot(confirming){
    var f=d.querySelector('#f-foot');
    var cm=(orig&&commentsCtl)?'<button class="btn ghost" data-m="comment" title="Leave a comment on this task">'+ico.chat+'Comment</button>':'';
    if(!editable){f.innerHTML=cm+'<span class="grow"></span><button class="btn" data-m="close">Close</button>';return;}
    if(confirming){f.innerHTML='<span class="confirm-t">Delete this task for good?</span><span class="grow"></span><button class="btn ghost" data-m="nodel">Keep it</button><button class="btn danger solid" data-m="yesdel">Delete</button>';return;}
    var pinned=t.today===TODAY;
    f.innerHTML=(orig?'<button class="btn ghost danger" data-m="delete">Delete</button>':'')+cm+
      '<button class="btn ghost'+(pinned?' pinned':'')+'" data-m="pin" title="Show this on your Today page">'+ico.sun+(pinned?'On Today':'Add to Today')+'</button>'+
      '<span class="grow"></span><button class="btn ghost" data-m="close">Cancel</button><button class="btn primary" data-m="save">'+(orig?'Save':'Add task')+'</button>';
  }
  function collect(){
    t.title=d.querySelector('#f-title').value.trim();
    t.projectId=d.querySelector('#f-proj').value;if(t.projectId==='__new'||!proj(t.projectId))t.projectId=orig?orig.projectId:(S.projects[0]&&S.projects[0].id);
    t.newStatus=d.querySelector('#f-status').value;
    t.priority=d.querySelector('#f-prio').value;
    t.due=d.querySelector('#f-due').value||'';
    t.est=Math.max(0,parseFloat(d.querySelector('#f-est').value)||0);
    t.repeat=d.querySelector('#f-rep').value;
    if(/^w[0-6]$/.test(t.repeat)&&(!t.due||parseD(t.due).getDay()!==+t.repeat[1])){ /* "Every Monday" → due on the next Monday (today counts) */
      var nx=parseD(TODAY);while(nx.getDay()!==+t.repeat[1])nx.setDate(nx.getDate()+1);t.due=dstr(nx);}
    t.notes=d.querySelector('#f-notes').value;
  }
  function save(){
    collect();
    if(!t.title){var ti=d.querySelector('#f-title');ti.focus();ti.placeholder='Give the task a title';return;}
    var target=orig;
    if(!target){target=addTask(t.projectId,t.title,'todo');}
    var moved=target.projectId!==t.projectId,oldDue=target.due;
    target.title=t.title;target.projectId=t.projectId;target.priority=t.priority;target.due=t.due;target.tags=t.tags;target.notes=t.notes;target.subtasks=t.subtasks;
    var bbNow=d.querySelector('#f-bb').checked;if(bbNow!==!!target.backburner)logAct((bbNow?'Moved “':'Brought “')+t.title+(bbNow?'” to the backburner':'” back from the backburner'),target);target.backburner=bbNow;
    target.est=t.est;target.repeat=t.repeat;target.deps=t.deps.slice();target.attachments=t.attachments;target.today=t.today;
    if(orig&&oldDue!==t.due)logAct(t.due?'Rescheduled “'+t.title+'” to '+fmtDue(t.due):'Removed the due date from “'+t.title+'”',target);
    if(moved)target.order=maxOrder()+1;
    var sn=d.querySelector('#f-stucknote').value.trim();
    if(stuckBy){if(!target.blocked||target.blocked.by!==stuckBy){target.blocked={by:stuckBy,since:TODAY,note:sn};logAct('Marked “'+t.title+'” stuck on '+STUCK_BY[stuckBy],target);}else target.blocked.note=sn;}
    else{if(target.blocked)logAct('Unstuck “'+t.title+'”',target);target.blocked=null;}
    setStatusOf(target,t.newStatus);
    closeModal();commit();
  }
  var stuckBy=(t.blocked&&t.status!=='done')?t.blocked.by:'';
  function drawStuck(){
    var opts=[['','Not stuck'],['supervisor','Stuck by supervisor'],['team','Stuck by team']];
    d.querySelector('#f-stuck').innerHTML=opts.map(function(o){return '<button type="button" class="'+(stuckBy===o[0]?'on':'')+'" data-stuck="'+o[0]+'"'+dis+'>'+(o[0]?ico.pause:'')+o[1]+'</button>';}).join('');
    var note=d.querySelector('#f-stucknote');note.style.display=stuckBy?'':'none';
    var info=d.querySelector('#f-stuckinfo');
    if(stuckBy&&orig&&orig.blocked&&orig.blocked.by===stuckBy&&orig.status!=='done'){var n=stuckDays(orig);info.className='stuck-info'+(stuckAlert(orig)?' alert':'');info.textContent='· '+(n===0?'since today':'for '+dayWord(n));}
    else info.textContent='';
  }
  d.querySelector('#f-stucknote').value=(t.blocked&&t.blocked.note)||'';
  drawStuck();drawDeps();drawAtts();drawSubs();drawFoot(false);
  var fpj=d.querySelector('#f-proj');if(fpj)fpj.addEventListener('change',function(){if(fpj.value!=='__new')drawDeps();});
  d.addEventListener('click',function(e){
    var sb=e.target.closest('[data-stuck]');if(sb&&editable){stuckBy=sb.getAttribute('data-stuck');drawStuck();if(stuckBy)d.querySelector('#f-stucknote').focus();return;}
    var g=e.target.closest('[data-goto]');if(g){closeModal();openTask(g.getAttribute('data-goto'));return;}
    var dd=e.target.closest('[data-depdel]');if(dd){var did=dd.getAttribute('data-depdel');t.deps=t.deps.filter(function(x){return x!==did;});drawDeps();return;}
    var ad=e.target.closest('[data-attdel]');if(ad){t.attachments.splice(+ad.getAttribute('data-attdel'),1);drawAtts();return;}
    var b=e.target.closest('[data-m],[data-sub],[data-subdel]');if(!b)return;
    if(b.hasAttribute('data-sub')){var s=t.subtasks[+b.getAttribute('data-sub')];s.done=!s.done;drawSubs();return;}
    if(b.hasAttribute('data-subdel')){t.subtasks.splice(+b.getAttribute('data-subdel'),1);drawSubs();return;}
    var m=b.getAttribute('data-m');
    if(m==='close')closeModal();
    else if(m==='save')save();
    else if(m==='pin'){t.today=t.today===TODAY?'':TODAY;drawFoot(false);}
    else if(m==='comment'){var tid=orig.id;closeModal();commentOnTask(tid);}
    else if(m==='delete')drawFoot(true);
    else if(m==='nodel')drawFoot(false);
    else if(m==='yesdel'){
      logAct('Deleted “'+orig.title+'”',{id:orig.id,projectId:orig.projectId,title:orig.title});
      S.tasks=S.tasks.filter(function(x){return x.id!==orig.id;});
      S.tasks.forEach(function(x){x.deps=x.deps.filter(function(dd2){return dd2!==orig.id;});});
      closeModal();commit();
    }
  });
  var sa=d.querySelector('#f-subadd');
  if(sa)sa.addEventListener('submit',function(e){e.preventDefault();var i=sa.querySelector('input');var v=i.value.trim();if(!v)return;t.subtasks.push({id:uid(),text:v,done:false});i.value='';drawSubs();});
  d.addEventListener('keydown',function(e){if(editable&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();save();}});
  d.querySelector('#f-title').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save();}});
  if(editable&&!orig)d.querySelector('#f-title').focus();
}

/* ---------- project modal ---------- */
function openProject(id,pos,parentId){
  if(!editable)return;
  var orig=id?proj(id):null;
  var p=orig?JSON.parse(JSON.stringify(orig)):{name:'',description:'',color:(COLORS.filter(function(c){return !S.projects.some(function(x){return x.color===c;});})[0]||COLORS[S.projects.length%COLORS.length]),archived:false};
  var curParent=orig?(orig.parentId||''):(parentId||'');
  var banned={};if(orig){banned[orig.id]=1;descendants(orig.id).forEach(function(c){banned[c.id]=1;});}
  var parentOpts='<option value="">— Nothing (top-level project) —</option>'+treeOrder().filter(function(n){return !banned[n.p.id];}).map(function(n){return '<option value="'+n.p.id+'"'+(n.p.id===curParent?' selected':'')+'>'+esc(fullName(n.p))+'</option>';}).join('');
  if(!orig&&parentId&&proj(parentId))p.color=proj(parentId).color;
  var d=openModal(
    '<div class="dlg-h"><h2>'+(orig?'Edit project':(parentId?'New sub-project':'New project'))+'</h2><button class="icon-btn" data-m="close" aria-label="Close">'+ico.x+'</button></div>'+
    '<label class="fld">Name<input id="p-name" value="'+esc(p.name)+'" placeholder="e.g. Website redesign"></label>'+
    '<label class="fld">Description <textarea id="p-desc" rows="2" placeholder="Optional — what is this project about?">'+esc(p.description)+'</textarea></label>'+
    '<label class="fld">Part of<select id="p-parent">'+parentOpts+'</select></label>'+
    (!orig&&S.templates.length?'<label class="fld">Start from a template<select id="p-tpl"><option value="">— Blank project —</option>'+S.templates.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+' ('+t.tasks.length+' tasks)</option>';}).join('')+'</select></label>':'')+
    '<div class="fld">Color<div class="swatches" id="p-sw"></div></div>'+
    (orig?'<label class="cb"><input type="checkbox" id="p-arch"'+(p.archived?' checked':'')+'>Archive this project <span class="hint">— hides it from the sidebar and overview</span></label>':'')+
    '<div class="dlg-f" id="p-foot"></div>','sm');
  function drawSw(){d.querySelector('#p-sw').innerHTML=COLORS.map(function(c){return '<button class="sw'+(c===p.color?' on':'')+'" style="background:'+c+'" data-c="'+c+'" aria-label="Color '+c+'"></button>';}).join('');}
  function drawFoot(confirming){
    var f=d.querySelector('#p-foot');
    if(confirming){var n=S.tasks.filter(function(t){return t.projectId===orig.id;}).length,kc=childrenOf(orig.id,true).length;f.innerHTML='<span class="confirm-t">Delete project and its '+n+' task'+(n===1?'':'s')+'?'+(kc?' Its '+kc+' sub-project'+(kc===1?'':'s')+' will stay.':'')+'</span><span class="grow"></span><button class="btn ghost" data-m="nodel">Keep</button><button class="btn danger solid" data-m="yesdel">Delete</button>';return;}
    f.innerHTML=(orig?'<button class="btn ghost danger" data-m="delete">Delete</button><button class="btn ghost" data-m="tpl" title="Reuse this project’s tasks later">Save as template</button>':'')+'<span class="grow"></span><button class="btn ghost" data-m="close">Cancel</button><button class="btn primary" data-m="save">'+(orig?'Save':'Create project')+'</button>';
  }
  function save(){
    var name=d.querySelector('#p-name').value.trim();
    if(!name){d.querySelector('#p-name').focus();return;}
    var desc=d.querySelector('#p-desc').value.trim();
    var par=d.querySelector('#p-parent').value||null;
    if(orig){orig.parentId=par;orig.name=name;orig.description=desc;orig.color=p.color;var ar=d.querySelector('#p-arch');if(ar)orig.archived=ar.checked;if(orig.archived)ui.showArchived=true;}
    else{
      var sp=pos||(par&&proj(par)?freeSpotNear(proj(par)):freeSpot());
      var np={id:uid(),name:name,description:desc,color:p.color,archived:false,created:TODAY,x:sp.x,y:sp.y,parentId:par};S.projects.push(np);
      logAct('Created project “'+name+'”',np);
      var tsel=d.querySelector('#p-tpl'),tpl=tsel&&tsel.value?S.templates.filter(function(x){return x.id===tsel.value;})[0]:null;
      if(tpl){applyTemplate(tpl,np.id);toast('Created from “'+tpl.name+'” with '+tpl.tasks.length+' tasks');}
      if(ui.view==='map'){ui.focus=np.id;justCreated=np.id;}else{ui.view='project';ui.pid=np.id;ui.mode='board';}
    }
    closeModal();commit();
  }
  drawSw();drawFoot(false);
  d.addEventListener('click',function(e){
    var b=e.target.closest('[data-m],[data-c]');if(!b)return;
    if(b.hasAttribute('data-c')){p.color=b.getAttribute('data-c');drawSw();return;}
    var m=b.getAttribute('data-m');
    if(m==='close')closeModal();else if(m==='save')save();else if(m==='delete')drawFoot(true);else if(m==='nodel')drawFoot(false);
    else if(m==='tpl'){saveTemplate(orig);scheduleSave();toast('Saved “'+orig.name+'” as a template. Use it when you create a new project');}
    else if(m==='yesdel'){logAct('Deleted project “'+orig.name+'”');S.tasks=S.tasks.filter(function(t){return t.projectId!==orig.id;});S.projects=S.projects.filter(function(x){return x.id!==orig.id;});S.links=S.links.filter(function(l){return l.a!==orig.id&&l.b!==orig.id;});S.projects.forEach(function(x){if(x.parentId===orig.id)x.parentId=orig.parentId||null;});if(ui.focus===orig.id)ui.focus=null;if(ui.view==='project')ui.view='map';closeModal();commit();}
  });
  d.querySelector('#p-name').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save();}});
  d.querySelector('#p-name').focus();
}

/* ---------- settings ---------- */
function openSettings(){
  var json=JSON.stringify(S,null,2),newLogo=null;
  var d=openModal(
    '<div class="dlg-h"><h2>Settings &amp; backup</h2><button class="icon-btn" data-m="close" aria-label="Close">'+ico.x+'</button></div>'+
    (editable?'<label class="fld">Workspace name<input id="s-title" value="'+esc(S.title)+'"></label>'+
      '<div class="sect"><h3>Logo</h3><p class="hint" style="margin:2px 0 0">Shown next to the name in the top-left corner. A square PNG with a transparent background looks best.</p>'+
        '<div class="logo-row"><div class="logo-prev" id="s-logoprev">'+(S.settings.logo?'<img src="/_blob/'+esc(S.settings.logo)+'" alt="">':ico.logo)+'</div>'+
        (assetsNs?'<label class="btn">'+ico.clip+'Upload image<input type="file" id="s-logo" hidden accept="image/png,image/webp,image/gif,image/jpeg,image/svg+xml"></label>':'<span class="hint">Uploading isn’t available in this view.</span>')+
        (S.settings.logo?'<button class="btn ghost" data-m="logo-reset">Use default</button>':'')+'<span class="hint" id="s-logoerr"></span></div></div>'+
      '<div class="sect"><h3>Your week</h3><div class="grid g2" style="margin-top:8px">'+
        '<label class="fld">Hours available per week<input type="number" id="s-hours" min="1" max="120" value="'+(+S.settings.weeklyHours||40)+'"></label>'+
        '<label class="fld">Weekly review day<select id="s-rday">'+opt([['1','Monday'],['2','Tuesday'],['3','Wednesday'],['4','Thursday'],['5','Friday'],['6','Saturday'],['0','Sunday']],String(S.settings.reviewDay))+'</select></label></div></div>'+
      '<div class="sect"><h3>Alerts</h3>'+
        '<label class="cb" style="margin-top:8px"><input type="checkbox" id="s-edge"'+(S.settings.alertStyle==='edge'?' checked':'')+'>Soft red glow around the screen edges when you open the site and something is pressing <span class="hint">(once a day)</span></label>'+
        '<label class="cb"><input type="checkbox" id="s-calm"'+(S.settings.calm?' checked':'')+'>Calm mode: no pulsing or moving effects. Urgent things still show in red.</label></div>'+
      (S.templates.length?'<div class="sect"><h3>Project templates</h3><div class="tpl-l">'+S.templates.map(function(t){return '<div class="mini"><span class="mini-t">'+esc(t.name)+' <span class="hint">'+t.tasks.length+' tasks</span></span><button class="btn ghost danger" data-tpldel="'+t.id+'">Delete</button></div>';}).join('')+'</div></div>':'')
    :'')+
    '<div class="sect"><h3>Back up your data</h3><p class="hint" style="margin:0 0 10px">Copies everything (projects and tasks) as text you can keep somewhere safe.</p><button class="btn" data-m="copy">Copy backup</button></div>'+
    (editable?'<div class="sect" style="margin-top:14px"><h3>Restore from a backup</h3><p class="hint" style="margin:0 0 8px">Paste a backup here. This replaces everything currently in the app.</p><div class="fld"><textarea id="s-import" rows="3" placeholder="Paste backup text…"></textarea></div><button class="btn" data-m="import">Restore</button> <span class="confirm-t" id="s-err"></span></div>':'')+
    '<div class="dlg-f"><span class="hint">'+S.projects.length+' projects · '+S.tasks.length+' tasks</span><span class="grow"></span>'+(editable?'<button class="btn ghost" data-m="close">Cancel</button><button class="btn primary" data-m="save">Save</button>':'<button class="btn" data-m="close">Close</button>')+'</div>','sm');
  d.addEventListener('click',function(e){
    if(e.target.closest('[data-m="logo-reset"]')){newLogo='';d.querySelector('#s-logoprev').innerHTML=ico.logo;e.target.closest('[data-m]').remove();return;}
    var td=e.target.closest('[data-tpldel]');if(td){var tid=td.getAttribute('data-tpldel');S.templates=S.templates.filter(function(x){return x.id!==tid;});td.closest('.mini').remove();scheduleSave();toast('Template deleted');return;}
    var b=e.target.closest('[data-m]');if(!b)return;var m=b.getAttribute('data-m');
    if(m==='close')closeModal();
    else if(m==='copy'){
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).then(function(){toast('Backup copied to clipboard');},function(){showRaw();});}else showRaw();
    }
    else if(m==='save'){
      var v=d.querySelector('#s-title').value.trim();if(v)S.title=v;
      var hrs=parseFloat(d.querySelector('#s-hours').value);if(hrs>0)S.settings.weeklyHours=Math.min(168,hrs);
      S.settings.reviewDay=+d.querySelector('#s-rday').value;
      S.settings.alertStyle=d.querySelector('#s-edge').checked?'edge':'none';
      S.settings.calm=d.querySelector('#s-calm').checked;
      if(newLogo!==null)S.settings.logo=newLogo;
      closeModal();commit();
    }
    else if(m==='import'){
      var err=d.querySelector('#s-err');var txt=d.querySelector('#s-import').value.trim();
      try{var n=JSON.parse(txt);if(!n||!Array.isArray(n.projects)||!Array.isArray(n.tasks))throw 0;S=normalize(n);ui.view='today';closeModal();commit();toast('Backup restored');}
      catch(_){err.textContent='That doesn’t look like a valid backup.';}
    }
  });
  var lf=d.querySelector('#s-logo');
  if(lf)lf.addEventListener('change',function(){
    var file=lf.files&&lf.files[0];if(!file)return;var err=d.querySelector('#s-logoerr');err.textContent='Uploading…';
    assetsNs.upload(file).then(function(r){newLogo=r.id;err.textContent='Looks good. Press Save to use it.';d.querySelector('#s-logoprev').innerHTML='<img src="'+esc(r.url)+'" alt="">';})
      .catch(function(e2){var c=e2&&e2.code;err.textContent=c==='too_large'?'That image is too big (2 MB max for SVG, 20 MB otherwise).':c==='unsupported_type'?'Please use a PNG, JPG, WebP, GIF or SVG.':'Couldn’t upload that image. Please try again.';});
  });
  function showRaw(){var ta=d.querySelector('#s-raw');if(!ta){var w=document.createElement('div');w.className='fld';w.style.marginTop='10px';w.innerHTML='<textarea id="s-raw" rows="5" readonly></textarea><span class="hint">Select all and copy this text.</span>';d.querySelector('.sect').appendChild(w);ta=w.querySelector('textarea');ta.value=json;}ta.focus();ta.select();}
}

/* ---------- boot ---------- */
render();
if(ui.refocus){var rf=document.querySelector('.quick[data-status="'+ui.refocus+'"] input');if(rf)rf.focus();ui.refocus=null;saveUI();}
var justSaved=store.get('pm-justsaved');store.del('pm-justsaved');
(function connect(){
  var C=window.claude;
  if(!C||typeof C.use!=='function'){booting=false;checkRecovery();render();setStatus('local');setTimeout(edgeGlow,400);return;}
  Promise.all([C.use('artifact').catch(function(){return null;}),C.use('user').catch(function(){return null;}),C.use('db').catch(function(){return null;})]).then(function(r){
    artifact=r[0];var u=r[1],dbNs=r[2];
    var check=Promise.resolve();
    if(u&&typeof u.isOwner==='function'){
      check=Promise.all([Promise.resolve().then(function(){return u.isOwner();}).catch(function(){return null;}),Promise.resolve().then(function(){return typeof u.canEdit==='function'?u.canEdit():null;}).catch(function(){return null;})]).then(function(x){
        if(x[0]===false&&x[1]===false)setReadOnly(true);
      });
    }
    C.use('comments').then(setupComments).catch(function(){});
    check.then(function(){
      if(editable)C.use('assets').then(function(a){assetsNs=a;}).catch(function(){});
      if(!dbNs){
        /* no live data store in this view: show the built-in copy, read-only, so nothing can split off */
        booting=false;snapshotOnly=true;dbMode=false;editable=false;saveState='ro';
        checkRecovery();render();setTimeout(edgeGlow,400);return;
      }
      var attempt=0;
      (function tryLoad(){
        attempt++;
        startDb(dbNs).then(function(){
          booting=false;editedBeforeLoad=false;render();setTimeout(edgeGlow,400);
        }).catch(function(e){
          dbMode=false;dbReady=false;
          try{console.warn('[projects] could not load saved data',e);}catch(_){}
          var code=(e&&e.code)||((e&&e.message)?'error: '+String(e.message).slice(0,80):'error'),wait=Math.min(30000,2000*Math.pow(2,attempt-1));
          bootMsg='Still connecting to your saved data ('+code+'). Trying again in '+Math.round(wait/1000)+'s…';
          if(attempt>=4)bootMsg+=' If this keeps happening, check your internet or open the page in its own browser tab.';
          render();setTimeout(tryLoad,wait);
        });
      })();
    });
  });
})();
})();
</script>
